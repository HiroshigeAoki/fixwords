<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="fixwords" content='{"marks": ["OK", "NG", "Exception"]}'>
  <title>Acceptance check</title>
  <style>
    body { max-width: 42rem; margin: auto; padding: 24px; font: 18px/1.6 sans-serif; color: #1f2933; background: #f7f9fb; }
    h1 { line-height: 1.2; margin: 0 0 16px; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { background: #fff; border: 1px solid #d5dbe1; border-radius: 10px; padding: 10px 14px; margin: 0 0 10px; }
  </style>
</head>
<body>
  <h1>Acceptance check</h1>
  <ul>
    <li data-fixwords-mark="1">Sign-in works</li>
    <li data-fixwords-mark="2">Reset email arrives</li>
    <li data-fixwords-mark="3">Cart total is correct</li>
    <li data-fixwords-mark="4">Receipt downloads</li>
    <li data-fixwords-mark="5">Sign-out works</li>
  </ul>
  <script src="../../../fixwords.js"></script>
</body>
</html>
