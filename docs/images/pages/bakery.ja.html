<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小さなパン屋</title>
  <style>
    body { max-width: 42rem; margin: auto; padding: 24px; font: 18px/1.6 sans-serif; color: #29251e; background: #fffaf0; }
    h1, h2 { line-height: 1.2; }
    svg { display: block; max-width: 100%; height: auto; }
    .tip { border-left: 4px solid #947647; padding-left: 16px; }
    body { font-family: 'Noto Sans CJK JP', 'Hiragino Sans', 'Yu Gothic', sans-serif; }
  </style>
</head>
<body>
  <h1>小さなパン屋</h1>
  <p>ゆっくりした朝のための、あたたかいパン。</p>
  <p class="tip" data-no-edit>下の「文言を直す」を押してみてください。文章や図の文字を直してから、直した内容をコピーします。直した内容はこのブラウザーに残ります。</p>
  <h2>焼きたてのパン</h2>
  <p>オーツ麦の食パンは、皮はぱりっと、中はふんわりしています。</p>
  <p>毎朝焼きたてです。</p>
  <h2>持ち帰り</h2>
  <p>毎朝焼きたてです。</p>
  <p>かごをお持ちください。<br>帰り道のために、パンを包みます。</p>
  <svg viewBox="0 0 400 120" width="400" role="img" aria-label="パンがかごに届くまで">
    <rect x="4" y="15" width="190" height="80" rx="12" fill="#f2d7a1"/>
    <rect x="242" y="15" width="150" height="80" rx="12" fill="#e2ebcc"/>
    <path d="M200 55h34m-8-8 8 8-8 8" fill="none" stroke="#705936" stroke-width="2"/>
    <text x="22" y="62" font-size="18">パンを焼く</text>
    <text x="260" y="48" font-size="18"><tspan>包んで</tspan><tspan x="260" dy="26">お渡し</tspan></text>
  </svg>
  <script src="../../../fixwords.js"></script>
</body>
</html>
